// INDEXEDDB ENGINE
// ═══════════════════════════════════════════════════════════════
const DB_NAME = 'star_tronics_db', DB_VER = 2;
const STORES = ['products','sales','credits','agents','users','settings','customers','expenses','purchases','stockAdjustments'];

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e.target.error);
  });
}
async function dbGetAll(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(store, item) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(item);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbPutMany(store, items) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    items.forEach(item => tx.objectStore(store).put(item));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(store, id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
async function dbClear(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).clear();
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
async function exportAllData() {
  const out = { _exportedAt: new Date().toISOString(), _version: DB_VER };
  for (const s of STORES) out[s] = await dbGetAll(s);
  return out;
}
async function importAllData(data) {
  for (const s of STORES) {
    if (!data[s]) continue;
    await dbClear(s);
    if (data[s].length) await dbPutMany(s, data[s]);
  }
}
async function getStorageEst() {
  if (navigator.storage && navigator.storage.estimate) {
    const e = await navigator.storage.estimate();
    return { used: e.usage||0, quota: e.quota||0, pct: e.quota ? Math.round((e.usage/e.quota)*100) : 0 };
  }
  return { used:0, quota:0, pct:0 };
}

const GOOGLE_CLIENT_ID = '1061622138956-sbvc4e7erg62dv4adpbj52sag0sj6fd2.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';
const DRIVE_FILE_NAME = 'star_tronics_data.json';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

let _tokenClient = null;

function initGoogleTokenClient(callback) {
  if (!window.google) return;
  _tokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    callback,
  });
}

function requestGoogleToken(prompt='') {
  if (!_tokenClient) return;
  _tokenClient.requestAccessToken({ prompt });
}

async function gdriveRequest(url, options={}, token) {
  const res = await fetch(url, {
    ...options,
    headers: { Authorization: `Bearer ${token}`, ...(options.headers||{}) },
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({error:{message:res.statusText}}));
    throw new Error(err.error?.message || res.statusText);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function gdriveGetUserInfo(token) {
  return gdriveRequest('https://www.googleapis.com/oauth2/v2/userinfo', {}, token);
}

async function gdriveFindFile(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const data = await gdriveRequest(`${DRIVE_API}/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {}, token);
  return data.files?.[0] || null;
}

async function gdriveLoadFile(token, fileId) {
  return gdriveRequest(`${DRIVE_API}/files/${fileId}?alt=media`, {}, token);
}

async function gdriveSaveFile(token, data, fileId) {
  const content = JSON.stringify({ ...data, _savedAt: new Date().toISOString() });
  const metadata = JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' });
  const boundary = 'st_boundary_779';
  const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const url = fileId
    ? `${DRIVE_UPLOAD}/files/${fileId}?uploadType=multipart`
    : `${DRIVE_UPLOAD}/files?uploadType=multipart`;
  const method = fileId ? 'PATCH' : 'POST';
  return gdriveRequest(url, {
    method,
    headers: { 'Content-Type': `multipart/related; boundary="${boundary}"` },
    body,
  }, token);
}

function xlsxExportFull(products,sales,expenses,customers,credits,agents,users) {
  const wb = XLSX.utils.book_new();
  // Sales sheet
  const salesRows = [["Date/Time","Product","Category","Customer","Qty","Sale Type","Payment Mode","Staff","Unit Price (TZS)","Total (TZS)"],
    ...sales.map(s=>[dtm(s.createdAt),s.productName,s.category||"",s.customerName||"Walk-in",s.qty,s.sellingType,s.paymentMode,s.staffName,s.unitPrice,s.total])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salesRows), "Sales");
  // Products sheet
  const prodRows = [["ID","Name","Category","Retail Price","Wholesale Price","Cost Price","Stock","Reorder Level","Status"],
    ...products.map(p=>[p.id,p.name,p.category,p.retailPrice,p.wholesalePrice,p.costPrice,p.stock,p.reorderLevel,p.stock<=p.reorderLevel?"LOW":"OK"])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prodRows), "Products");
  // Expenses sheet
  const expRows = [["Date","Category","Amount (TZS)","Description","Recorded By"],
    ...expenses.map(e=>{const u=users.find(x=>x.id===e.recordedBy);return[e.date,e.category,e.amount,e.description||"",u?.name||""]})];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), "Expenses");
  // Customers sheet
  const custRows = [["Name","Phone","Area","Email","Credit Balance (TZS)","Notes","Joined"],
    ...customers.map(c=>[c.name,c.phone||"",c.area||"",c.email||"",c.creditBalance||0,c.notes||"",donly(c.createdAt)])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custRows), "Customers");
  // Winga Credits sheet
  const creditRows = [["Credit ID","Agent","Date","Status","Total Due (TZS)","Paid (TZS)","Balance (TZS)","Notes"],
    ...credits.map(c=>{
      const agent=agents.find(a=>a.id===c.agentId);
      const totalDue=c.items.reduce((s,item)=>{const p=products.find(x=>x.id===item.productId);return s+((p?.wholesalePrice||0)*item.qtySold);},0);
      return[c.id,agent?.name||"",c.issueDate,c.status,totalDue,c.paidAmount||0,totalDue-(c.paidAmount||0),c.notes||""];
    })];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(creditRows), "Winga Credits");
  // Summary sheet

// XLSX Import — reads products sheet to update/add products
function xlsxImportProducts(file, existingProducts, onDone, onError) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
      // Expected header: ID, Name, Category, Retail Price, Wholesale Price, Cost Price, Stock, Reorder Level
      const imported = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[1]) continue; // skip empty rows
        imported.push({
          id: Number(r[0]) || Date.now() + i,
          name: String(r[1]||"").trim(),
          category: String(r[2]||CATEGORIES[0]).trim(),
          retailPrice: Number(r[3])||0,
          wholesalePrice: Number(r[4])||0,
          costPrice: Number(r[5])||0,
          stock: Number(r[6])||0,
          reorderLevel: Number(r[7])||0,
        });
      }
      onDone(imported);
    } catch(err) { onError(err.message); }
  };
  reader.readAsBinaryString(file);
}

// XLSX Full Import — reads all sheets from a full export file
function xlsxImportFull(file, onDone, onError) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      // We only restore Products, Expenses, Customers from XLSX
      // (Sales history is read-only reference)
      const result = {};
      if (wb.Sheets["Products"]) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Products"], { header: 1 });
        result.products = rows.slice(1).filter(r=>r[1]).map((r,i)=>({
          id:Number(r[0])||Date.now()+i, name:String(r[1]||"").trim(), category:String(r[2]||"").trim(),
          retailPrice:Number(r[3])||0, wholesalePrice:Number(r[4])||0, costPrice:Number(r[5])||0,
          stock:Number(r[6])||0, reorderLevel:Number(r[7])||0,
        }));
      }
      if (wb.Sheets["Customers"]) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Customers"], { header: 1 });
        result.customers = rows.slice(1).filter(r=>r[0]).map((r,i)=>({
          id:Date.now()+i, name:String(r[0]||"").trim(), phone:String(r[1]||""),
          area:String(r[2]||""), email:String(r[3]||""), creditBalance:Number(r[5])||0,
          notes:String(r[7]||""), createdAt:new Date().toISOString(),
        }));
      }
      if (wb.Sheets["Expenses"]) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Expenses"], { header: 1 });
        result.expenses = rows.slice(1).filter(r=>r[0]).map((r,i)=>({
          id:Date.now()+i+1000, date:String(r[0]||today()), category:String(r[1]||"Other"),
          amount:Number(r[2])||0, description:String(r[3]||""), recordedBy:1, createdAt:new Date().toISOString(),
        }));
      }
      onDone(result);
    } catch(err) { onError(err.message); }
  };
  reader.readAsBinaryString(file);
}

// Profit Report Component
const ProfitReport = ({sales,expenses,products}) => {
  const revenue=sales.reduce((s,x)=>s+x.total,0);
  const cogs=sales.reduce((s,sale)=>{const p=products.find(x=>x.id===sale.productId);return s+((p?.costPrice||0)*sale.qty);},0);
  const gp=revenue-cogs, totalExp=expenses.reduce((s,e)=>s+e.amount,0), netProfit=gp-totalExp;
  const byCat={};
  sales.forEach(sale=>{
    const p=products.find(x=>x.id===sale.productId); const cat=p?.category||"Unknown";
    const cost=(p?.costPrice||0)*sale.qty;
    if(!byCat[cat])byCat[cat]={rev:0,cogs:0};
    byCat[cat].rev+=sale.total; byCat[cat].cogs+=cost;
  });
  const byExpCat={};
  expenses.forEach(e=>{byExpCat[e.category]=(byExpCat[e.category]||0)+e.amount;});
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        <MCard title="Revenue" value={cur(revenue)} icon="💰" cls="bg-blue-50 text-blue-500"/>
        <MCard title="Cost of Goods" value={cur(cogs)} icon="📦" cls="bg-slate-50 text-slate-500"/>
        <MCard title="Gross Profit" value={cur(gp)} sub={revenue?`Margin: ${((gp/revenue)*100).toFixed(1)}%`:""} icon="📈" cls={gp>=0?"bg-emerald-50 text-emerald-500":"bg-red-50 text-red-500"}/>
        <MCard title="Expenses" value={cur(totalExp)} icon="💸" cls="bg-amber-50 text-amber-500"/>
        <MCard title="Net Profit" value={cur(netProfit)} sub={revenue?`Margin: ${((netProfit/revenue)*100).toFixed(1)}%`:""} icon="🏆" cls={netProfit>=0?"bg-emerald-50 text-emerald-600":"bg-red-50 text-red-600"}/>
        <MCard title="Items Sold" value={sales.reduce((s,x)=>s+x.qty,0)} icon="🛍️"/>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card>
          <CH><CT>Profit by Category</CT></CH>
          <CC>
            <Tbl><thead><tr><Th>Category</Th><Th>Revenue</Th><Th>COGS</Th><Th>Gross Profit</Th><Th>Margin</Th></tr></thead>
              <tbody>{Object.entries(byCat).sort((a,b)=>b[1].rev-a[1].rev).map(([cat,d])=>{
                const g=d.rev-d.cogs;
                return <tr key={cat}><Td>{cat}</Td><Td>{cur(d.rev)}</Td><Td>{cur(d.cogs)}</Td>
                  <Td cls={g>=0?"text-emerald-600 font-semibold":"text-red-600 font-semibold"}>{cur(g)}</Td>
                  <Td>{d.rev?((g/d.rev)*100).toFixed(1):0}%</Td></tr>;
              })}{!Object.keys(byCat).length&&<tr><Td cls="text-center text-slate-400 py-6" colSpan={5}>No sales data</Td></tr>}
              </tbody>
            </Tbl>
          </CC>
        </Card>
        <Card>
          <CH><CT>Expenses by Category</CT></CH>
          <CC>
            {!Object.keys(byExpCat).length&&<p className="text-xs text-slate-400">No expenses for this period.</p>}
            <div className="space-y-1.5">
              {Object.entries(byExpCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(
                <div key={cat} className="flex justify-between rounded-xl bg-slate-50 px-3 py-2">
                  <span className="text-xs">{cat}</span>
                  <span className="text-xs font-semibold">{cur(amt)}</span>
                </div>
              ))}
              {Object.keys(byExpCat).length>0&&<div className="flex justify-between rounded-xl bg-slate-800 text-white px-3 py-2 mt-2">
                <span className="text-xs font-medium">Total</span><span className="text-xs font-bold">{cur(totalExp)}</span></div>}

      </div>

  );

function App() {
  const [loaded,setLoaded]=useState(false);
  const [products,setProducts]=useState([]);
  const [sales,setSales]=useState([]);
  const [credits,setCredits]=useState([]);
  const [agents,setAgents]=useState([]);
  const [users,setUsers]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [purchases,setPurchases]=useState([]);
  const [settings,setSettings]=useState({id:"main",businessName:"STAR TRONICS",businessLocation:"Dar es Salaam",footerNote:"",currency:"TZS"});
  const [storageEst,setStorageEst]=useState(null);
  const [currentUser,setCurrentUser]=useState(null);
  const [loginForm,setLoginForm]=useState({username:"admin",password:"admin123"});

  // Google Drive states
  const [googleReady,setGoogleReady]=useState(false);
  const [googleUser,setGoogleUser]=useState(null);
  const [googleToken,setGoogleToken]=useState(null);
  const [driveFileId,setDriveFileId]=useState(null);
  const [syncStatus,setSyncStatus]=useState("idle"); // idle | syncing | synced | error | offline
  const [lastSynced,setLastSynced]=useState(null);
  const [googleError,setGoogleError]=useState("");
  const tokenRef=useRef(null);
  const fileIdRef=useRef(null);
  const syncTimerRef=useRef(null);
  const syncStateRef=useRef({});
  const [tab,setTab]=useState("dashboard");
  const [search,setSearch]=useState("");
  const [msg,setMsg]=useState({text:"",type:"ok"});
  const [reportTab,setReportTab]=useState("daily");
  const [profitTab,setProfitTab]=useState("daily");
  const [printRpt,setPrintRpt]=useState(null);
  const [viewCust,setViewCust]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [settingsEdit,setSettingsEdit]=useState(null);
  // historical entry state
  const [histSalesDate,setHistSalesDate]=useState(today());
  const [histSalesLines,setHistSalesLines]=useState([{productId:"",qty:1,sellingType:"retail",paymentMode:"cash",customerId:""}]);
  const [histStockDate,setHistStockDate]=useState(today());
  const [histStockLines,setHistStockLines]=useState([{productId:"",qty:"",costPerUnit:"",notes:""}]);
  const [histSubTab,setHistSubTab]=useState("sales");
  const [histViewDate,setHistViewDate]=useState("");
  // forms
  const [pForm,setPForm]=useState({name:"",category:CATEGORIES[0],retailPrice:"",wholesalePrice:"",costPrice:"",stock:"",reorderLevel:""});
  const [sForm,setSForm]=useState({productId:"",qty:1,sellingType:"retail",paymentMode:"cash",customerType:"walk-in",customerId:""});
  const [aForm,setAForm]=useState({name:"",phone:"",area:"",status:"active"});
  const [crForm,setCrForm]=useState({agentId:"",notes:"",paidAmount:0,lines:[{productId:"",qtyIssued:1,qtyReturned:0}]});
  const [uForm,setUForm]=useState({name:"",username:"",password:"",role:"employee",signature:""});
  const [custF,setCustF]=useState({name:"",phone:"",area:"",email:"",notes:""});
  const [expF,setExpF]=useState({category:EXP_CATS[0],amount:"",description:"",date:today()});
  const [purchF,setPurchF]=useState({supplierName:"",date:today(),notes:"",lines:[{productId:"",qty:1,costPerUnit:""}]});
  const [payDebt,setPayDebt]=useState({customerId:"",amount:""});
  const xlsxImportRef=useRef(), jsonImportRef=useRef(), xlsxProdRef=useRef();

  // ── Load local DB ────────────────────────────────────────────
  async function loadLocalDB(){
    try{
      let p=await dbGetAll("products"); if(!p.length){await dbPutMany("products",SEED_PRODUCTS);p=SEED_PRODUCTS;}
      let u=await dbGetAll("users"); if(!u.length){await dbPutMany("users",SEED_USERS);u=SEED_USERS;}
      let a=await dbGetAll("agents"); if(!a.length){await dbPutMany("agents",SEED_AGENTS);a=SEED_AGENTS;}
      let s=await dbGetAll("sales"); if(!s.length){await dbPutMany("sales",SEED_SALES);s=SEED_SALES;}
      let c=await dbGetAll("credits"); if(!c.length){await dbPutMany("credits",SEED_CREDITS);c=SEED_CREDITS;}
      let cu=await dbGetAll("customers"); if(!cu.length){await dbPutMany("customers",SEED_CUSTOMERS);cu=SEED_CUSTOMERS;}
      let ex=await dbGetAll("expenses"); if(!ex.length){await dbPutMany("expenses",SEED_EXPENSES);ex=SEED_EXPENSES;}
      let pu=await dbGetAll("purchases"); if(!pu.length){await dbPutMany("purchases",SEED_PURCHASES);pu=SEED_PURCHASES;}
      let st=await dbGetAll("settings"); if(!st.length){await dbPutMany("settings",SEED_SETTINGS);st=SEED_SETTINGS;}
      setProducts(p);setUsers(u);setAgents(a);setSales(s);setCredits(c);
      setCustomers(cu);setExpenses(ex);setPurchases(pu);
      if(st[0])setSettings(st[0]);
    }catch(e){notify("DB error: "+e.message,"err");}
  }

  // ── Apply Drive data to local DB ─────────────────────────────
  async function applyDriveData(data){
    if(!data||!data.products) return false;
    await importAllData(data);
    const p=await dbGetAll("products"),u=await dbGetAll("users"),a=await dbGetAll("agents"),
      s=await dbGetAll("sales"),c=await dbGetAll("credits"),cu=await dbGetAll("customers"),
      ex=await dbGetAll("expenses"),pu=await dbGetAll("purchases"),st=await dbGetAll("settings");
    setProducts(p.length?p:SEED_PRODUCTS);setUsers(u.length?u:SEED_USERS);setAgents(a.length?a:SEED_AGENTS);
    setSales(s.length?s:SEED_SALES);setCredits(c.length?c:SEED_CREDITS);setCustomers(cu.length?cu:SEED_CUSTOMERS);
    setExpenses(ex.length?ex:SEED_EXPENSES);setPurchases(pu.length?pu:SEED_PURCHASES);
    if(st[0])setSettings(st[0]);
    return true;
  }

  // ── Drive sync ───────────────────────────────────────────────
  async function doSync(forceData){
    const token=tokenRef.current; if(!token)return;
    setSyncStatus("syncing");
    try{
      const data=forceData||await exportAllData();
      let fid=fileIdRef.current;
      if(!fid){const f=await gdriveFindFile(token);fid=f?.id||null;fileIdRef.current=fid;}
      const result=await gdriveSaveFile(token,data,fid);
      if(!fid&&result?.id){fileIdRef.current=result.id;setDriveFileId(result.id);}
      setSyncStatus("synced");setLastSynced(new Date());
    }catch(e){
      if(e.message?.includes('401')||e.message?.includes('invalid_token')){
        setSyncStatus("offline");requestGoogleToken('');
      } else { setSyncStatus("error"); }
    }
  }

  function scheduleSync(){
    clearTimeout(syncTimerRef.current);
    setSyncStatus("pending");
    syncTimerRef.current=setTimeout(async()=>{await doSync();},4000);
  }

  // ── On every data change → schedule a Drive sync ─────────────
  useEffect(()=>{
    if(tokenRef.current&&loaded){scheduleSync();}
  },[products,sales,credits,agents,customers,expenses,purchases,settings]);

  // ── Main init ────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      await loadLocalDB();
      setLoaded(true);
      const est=await getStorageEst();setStorageEst(est);

      // Wait for Google GSI script to load
      let tries=0;
      const waitForGoogle=setInterval(()=>{
        tries++;
        if(window.google?.accounts?.oauth2||tries>20){
          clearInterval(waitForGoogle);
          if(window.google?.accounts?.oauth2){
            initGoogleTokenClient(async(resp)=>{
              if(resp.error){setGoogleError(resp.error);setSyncStatus("error");return;}
              tokenRef.current=resp.access_token;
              setGoogleToken(resp.access_token);
              setSyncStatus("syncing");
              try{
                // Get user info
                const info=await gdriveGetUserInfo(resp.access_token);
                setGoogleUser(info);
                // Find or load Drive file
                const f=await gdriveFindFile(resp.access_token);
                if(f){
                  fileIdRef.current=f.id;setDriveFileId(f.id);
                  const driveData=await gdriveLoadFile(resp.access_token,f.id);
                  const applied=await applyDriveData(driveData);
                  if(applied){setSyncStatus("synced");setLastSynced(new Date());}
                  else{setSyncStatus("synced");setLastSynced(new Date());}
                } else {
                  // No file yet → save current data to Drive
                  const localData=await exportAllData();
                  const result=await gdriveSaveFile(resp.access_token,localData,null);
                  if(result?.id){fileIdRef.current=result.id;setDriveFileId(result.id);}
                  setSyncStatus("synced");setLastSynced(new Date());
                }
              }catch(e){setSyncStatus("error");setGoogleError(e.message);}
            });
            setGoogleReady(true);
            // Try silent sign-in
            requestGoogleToken('');
          }
        }
      },300);
    })();
  },[]);

  const notify=(text,type="ok")=>{setMsg({text,type});setTimeout(()=>setMsg({text:"",type:"ok"}),3500);};
  const refreshEst=async()=>{const e=await getStorageEst();setStorageEst(e);};

  const filtProd=useMemo(()=>products.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(search.toLowerCase())),[products,search]);

  const salesD=useMemo(()=>sales.map(sale=>{
    const product=products.find(p=>p.id===sale.productId);
    const user=users.find(u=>u.id===sale.soldBy);
    const customer=customers.find(c=>c.id===sale.customerId);
    const unitPrice=getPrice(product||{},sale.sellingType);
    return{...sale,productName:product?.name||"Unknown",category:product?.category||"",staffName:user?.name||"Unknown",customerName:customer?.name||null,unitPrice,total:unitPrice*sale.qty,costPrice:product?.costPrice||0};
  }),[sales,products,users,customers]);

  const now=new Date();
  const daySales=salesD.filter(s=>sameDay(s.createdAt));
  const wkStart=sowk(now),wkEnd=eowk(now);
  const wkSales=salesD.filter(s=>inRange(s.createdAt,wkStart,wkEnd));
  const mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const mEnd=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59);
  const monSales=salesD.filter(s=>inRange(s.createdAt,mStart,mEnd));
  const dayExp=expenses.filter(e=>sameDay(e.date));
  const wkExp=expenses.filter(e=>inRange(e.date,wkStart,wkEnd));
  const monExp=expenses.filter(e=>inRange(e.date,mStart,mEnd));
  const dayRev=daySales.reduce((s,x)=>s+x.total,0);
  const monRev=monSales.reduce((s,x)=>s+x.total,0);
  const netToday=useMemo(()=>{
    const rev=daySales.reduce((s,x)=>s+x.total,0);
    const cogs=daySales.reduce((s,x)=>s+x.costPrice*x.qty,0);
    const exp=dayExp.reduce((s,e)=>s+e.amount,0);
    return rev-cogs-exp;
  },[daySales,dayExp]);
  const lowStock=products.filter(p=>p.stock<=p.reorderLevel);
  const topItems=useMemo(()=>{
    const c={};salesD.forEach(s=>{c[s.productName]=(c[s.productName]||0)+s.qty;});
    return Object.entries(c).map(([name,qty])=>({name,qty})).sort((a,b)=>b.qty-a.qty).slice(0,8);
  },[salesD]);
  const creditD=useMemo(()=>credits.map(cr=>{
    const agent=agents.find(a=>a.id===cr.agentId);
    const totalDue=cr.items.reduce((sum,item)=>{const p=products.find(x=>x.id===item.productId);return sum+((p?.wholesalePrice||0)*item.qtySold);},0);
    const balance=totalDue-(cr.paidAmount||0);
    return{...cr,agentName:agent?.name||"Unknown",totalDue,balance};
  }),[credits,agents,products]);
  const outCredits=creditD.filter(c=>c.balance>0);
  const isAdmin=currentUser?.role==="admin";

  async function upStock(pid,newStk){
    const p=products.find(x=>x.id===pid);if(!p)return;
    const u={...p,stock:newStk};await dbPut("products",u);
    setProducts(prev=>prev.map(x=>x.id===pid?u:x));
  }
  function handleLogin(){
    const u=users.find(x=>x.username===loginForm.username&&x.password===loginForm.password);
    if(!u)return notify("Invalid username or password","err");
    setCurrentUser(u);notify(`Welcome, ${u.name}`);
  }
  function logout(){setCurrentUser(null);setTab("dashboard");}
  async function addProduct(){
    if(!pForm.name)return;
    const p={id:Date.now(),...pForm,retailPrice:Number(pForm.retailPrice),wholesalePrice:Number(pForm.wholesalePrice),costPrice:Number(pForm.costPrice),stock:Number(pForm.stock),reorderLevel:Number(pForm.reorderLevel||0)};
    await dbPut("products",p);setProducts(prev=>[p,...prev]);
    setPForm({name:"",category:CATEGORIES[0],retailPrice:"",wholesalePrice:"",costPrice:"",stock:"",reorderLevel:""});
    notify("Product added");refreshEst();
  }
  async function delProduct(id){
    if(sales.some(s=>s.productId===id))return notify("Cannot delete — has sales history","err");
    await dbDelete("products",id);setProducts(prev=>prev.filter(p=>p.id!==id));notify("Deleted");
  }
  async function addSale(){
    if(!sForm.productId||!currentUser)return;
    const pid=Number(sForm.productId),qty=Number(sForm.qty);
    const prod=products.find(p=>p.id===pid);
    if(!prod)return;
    if(prod.stock<qty)return notify("Insufficient stock","err");
    const sale={id:Date.now(),productId:pid,qty,sellingType:sForm.sellingType,paymentMode:sForm.paymentMode,
      soldBy:currentUser.id,customerId:sForm.customerId?Number(sForm.customerId):null,
      createdAt:new Date().toISOString(),customerType:sForm.customerType};
    await dbPut("sales",sale);setSales(prev=>[sale,...prev]);
    await upStock(pid,prod.stock-qty);
    if(sForm.paymentMode==="credit"&&sForm.customerId){
      const cust=customers.find(c=>c.id===Number(sForm.customerId));
      if(cust){const price=getPrice(prod,sForm.sellingType);const u={...cust,creditBalance:(cust.creditBalance||0)+price*qty};await dbPut("customers",u);setCustomers(prev=>prev.map(c=>c.id===u.id?u:c));}
    }
    setSForm({productId:"",qty:1,sellingType:"retail",paymentMode:"cash",customerType:"walk-in",customerId:""});
    notify("Sale recorded");refreshEst();
  }
  async function addAgent(){if(!aForm.name)return;const a={id:Date.now(),...aForm};await dbPut("agents",a);setAgents(prev=>[a,...prev]);setAForm({name:"",phone:"",area:"",status:"active"});notify("Agent added");}
  const addCrLine=()=>setCrForm(p=>({...p,lines:[...p.lines,{productId:"",qtyIssued:1,qtyReturned:0}]}));
  const updCrLine=(i,f,v)=>setCrForm(p=>({...p,lines:p.lines.map((l,idx)=>idx===i?{...l,[f]:v}:l)}));
  async function saveCrIssue(){
    if(!crForm.agentId||!currentUser)return;
    const items=crForm.lines.filter(l=>l.productId).map(l=>{const qi=Number(l.qtyIssued||0),qr=Number(l.qtyReturned||0);return{productId:Number(l.productId),qtyIssued:qi,qtyReturned:qr,qtySold:Math.max(qi-qr,0)};});
    for(const item of items){const p=products.find(x=>x.id===item.productId);if(!p||p.stock<item.qtyIssued)return notify(`Insufficient stock for ${p?.name||"item"}`,"err");}
    const cr={id:Date.now(),agentId:Number(crForm.agentId),issueDate:today(),issuedBy:currentUser.id,status:Number(crForm.paidAmount)>0?"partial":"open",paidAmount:Number(crForm.paidAmount||0),notes:crForm.notes,items};
    await dbPut("credits",cr);setCredits(prev=>[cr,...prev]);
    for(const item of items){const p=products.find(x=>x.id===item.productId);await upStock(item.productId,p.stock-item.qtyIssued+item.qtyReturned);}
    setCrForm({agentId:"",notes:"",paidAmount:0,lines:[{productId:"",qtyIssued:1,qtyReturned:0}]});notify("Settlement recorded");refreshEst();
  }
  async function addCustomer(){if(!custF.name)return;const c={id:Date.now(),...custF,creditBalance:0,createdAt:new Date().toISOString()};await dbPut("customers",c);setCustomers(prev=>[c,...prev]);setCustF({name:"",phone:"",area:"",email:"",notes:""});notify("Customer added");}
  async function payCustomerDebt(){
    if(!payDebt.customerId||!payDebt.amount)return;
    const cust=customers.find(c=>c.id===Number(payDebt.customerId));if(!cust)return;
    const u={...cust,creditBalance:Math.max((cust.creditBalance||0)-Number(payDebt.amount),0)};
    await dbPut("customers",u);setCustomers(prev=>prev.map(c=>c.id===u.id?u:c));
    setPayDebt({customerId:"",amount:""});notify("Payment recorded");
  }
  async function addExpense(){if(!expF.amount)return;const e={id:Date.now(),...expF,amount:Number(expF.amount),recordedBy:currentUser.id,createdAt:new Date().toISOString()};await dbPut("expenses",e);setExpenses(prev=>[e,...prev]);setExpF({category:EXP_CATS[0],amount:"",description:"",date:today()});notify("Expense recorded");refreshEst();}
  async function delExpense(id){await dbDelete("expenses",id);setExpenses(prev=>prev.filter(e=>e.id!==id));notify("Deleted");}
  const addPurchLine=()=>setPurchF(p=>({...p,lines:[...p.lines,{productId:"",qty:1,costPerUnit:""}]}));
  const updPurchLine=(i,f,v)=>setPurchF(p=>({...p,lines:p.lines.map((l,idx)=>idx===i?{...l,[f]:v}:l)}));
  async function savePurchase(){
    if(!purchF.supplierName)return notify("Enter supplier name","err");
    const items=purchF.lines.filter(l=>l.productId).map(l=>({productId:Number(l.productId),qty:Number(l.qty||0),costPerUnit:Number(l.costPerUnit||0)}));
    if(!items.length)return notify("Add at least one item","err");
    const totalCost=items.reduce((s,i)=>s+i.qty*i.costPerUnit,0);
    const pu={id:Date.now(),...purchF,totalCost,items,recordedBy:currentUser.id,createdAt:new Date().toISOString()};
    await dbPut("purchases",pu);setPurchases(prev=>[pu,...prev]);
    for(const item of items){const p=products.find(x=>x.id===item.productId);if(p)await upStock(item.productId,p.stock+item.qty);}
    setPurchF({supplierName:"",date:today(),notes:"",lines:[{productId:"",qty:1,costPerUnit:""}]});notify("Stock updated");refreshEst();
  }
  async function addUser(){if(!uForm.name||!uForm.username||!uForm.password)return;if(users.some(u=>u.username===uForm.username))return notify("Username taken","err");const u={id:Date.now(),...uForm,signature:uForm.signature||uForm.name};await dbPut("users",u);setUsers(prev=>[u,...prev]);setUForm({name:"",username:"",password:"",role:"employee",signature:""});notify("User created");}
  async function saveSettings(){await dbPut("settings",settingsEdit);setSettings(settingsEdit);setSettingsEdit(null);notify("Settings saved");}

  // CSV exports
  const csvDl=(rows,name)=>dlFile(rows.map(r=>r.map(c=>JSON.stringify(c??"")||'""').join(",")).join("\n"),name,"text/csv");
  const expCSV=(target)=>{const map={daily:daySales,weekly:wkSales,monthly:monSales,all:salesD};const s=map[target]||salesD;csvDl([["Date/Time","Product","Category","Customer","Qty","Type","Payment","Staff","Unit Price","Total"],...s.map(x=>[dtm(x.createdAt),x.productName,x.category,x.customerName||"",x.qty,x.sellingType,x.paymentMode,x.staffName,x.unitPrice,x.total])],`sales_${target}_${today()}.csv`);notify("CSV exported");};
  const invCSV=()=>{csvDl([["ID","Name","Category","Retail","Wholesale","Cost","Stock","Reorder","Status"],...products.map(p=>[p.id,p.name,p.category,p.retailPrice,p.wholesalePrice,p.costPrice,p.stock,p.reorderLevel,p.stock<=p.reorderLevel?"LOW":"OK"])],`inventory_${today()}.csv`);notify("CSV exported");};
  const expExpCSV=()=>{csvDl([["Date","Category","Amount","Description"],...expenses.map(e=>[e.date,e.category,e.amount,e.description||""])],`expenses_${today()}.csv`);notify("CSV exported");};
  const custCSV=()=>{csvDl([["Name","Phone","Area","Email","Credit Balance","Notes"],...customers.map(c=>[c.name,c.phone,c.area,c.email,c.creditBalance||0,c.notes||""])],`customers_${today()}.csv`);notify("CSV exported");};

  // JSON export/import
  const exportJSON=async()=>{const data=await exportAllData();dlFile(JSON.stringify(data,null,2),`STAR_TRONICS_backup_${today()}.json`);notify("JSON backup exported");};
  const handleJSON=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.products||!data.users)throw new Error("Invalid file");await importAllData(data);setProducts(await dbGetAll("products"));setUsers(await dbGetAll("users"));setAgents(await dbGetAll("agents"));setSales(await dbGetAll("sales"));setCredits(await dbGetAll("credits"));setCustomers(await dbGetAll("customers"));setExpenses(await dbGetAll("expenses"));setPurchases(await dbGetAll("purchases"));const st=await dbGetAll("settings");if(st[0])setSettings(st[0]);notify("Data restored!");refreshEst();}catch(err){notify("Import failed: "+err.message,"err");}e.target.value="";};

  // XLSX full export (admin)
  const xlsxFull=()=>xlsxExportFull(products,salesD,expenses,customers,creditD,agents,users);

  // XLSX full import (admin)
  const handleXLSXImport=e=>{
    const file=e.target.files?.[0];if(!file)return;
    xlsxImportFull(file,async result=>{
      if(result.products){await dbClear("products");await dbPutMany("products",result.products);setProducts(result.products);}
      if(result.customers){await dbClear("customers");await dbPutMany("customers",result.customers);setCustomers(result.customers);}
      if(result.expenses){await dbClear("expenses");await dbPutMany("expenses",result.expenses);setExpenses(result.expenses);}
      notify(`XLSX restored: ${result.products?.length||0} products, ${result.customers?.length||0} customers, ${result.expenses?.length||0} expenses`);refreshEst();
    },err=>notify("XLSX import failed: "+err,"err"));
    e.target.value="";
  };

  // XLSX products only import
  const handleXLSXProds=e=>{
    const file=e.target.files?.[0];if(!file)return;
    xlsxImportProducts(file,products,async imported=>{
      await dbClear("products");await dbPutMany("products",imported);setProducts(imported);
      notify(`${imported.length} products imported from XLSX`);refreshEst();
    },err=>notify("Import failed: "+err,"err"));
    e.target.value="";
  };


  // ── HISTORICAL SALES ──────────────────────────────────────────
  const addHistSalesLine=()=>setHistSalesLines(p=>[...p,{productId:"",qty:1,sellingType:"retail",paymentMode:"cash",customerId:""}]);
  const removeHistSalesLine=i=>setHistSalesLines(p=>p.filter((_,idx)=>idx!==i));
  const updHistSalesLine=(i,f,v)=>setHistSalesLines(p=>p.map((l,idx)=>idx===i?{...l,[f]:v}:l));
  async function saveHistoricalSales(){
    const validLines=histSalesLines.filter(l=>l.productId&&Number(l.qty)>0);
    if(!validLines.length)return notify("Add at least one item with product and quantity","err");
    if(!histSalesDate)return notify("Select a date","err");
    const saved=[];
    for(const line of validLines){
      const pid=Number(line.productId),qty=Number(line.qty);
      const prod=products.find(p=>p.id===pid);
      if(!prod)continue;
      if(prod.stock<qty)return notify(`Insufficient stock for "${prod.name}" — add historical stock first`,"err");
      const sale={
        id:Date.now()+Math.random(),
        productId:pid,qty,
        sellingType:line.sellingType,
        paymentMode:line.paymentMode,
        soldBy:currentUser.id,
        customerId:line.customerId?Number(line.customerId):null,
        createdAt:histSalesDate+"T12:00:00.000Z",
        customerType:line.sellingType==="wholesale"?"reseller":"walk-in",
        isHistorical:true,
      };
      await dbPut("sales",sale);
      saved.push(sale);
      await upStock(pid,prod.stock-qty);

      }

    setHistSalesLines([{productId:"",qty:1,sellingType:"retail",paymentMode:"cash",customerId:""}]);

    let updated=0;
    for(const line of validLines){
      const pid=Number(line.productId),qty=Number(line.qty);
      const prod=products.find(p=>p.id===pid);
      if(!prod)continue;
      // Record as a stock adjustment
      const adj={
        id:Date.now()+Math.random(),
        productId:pid,
        qty,
        type:"historical_opening",
        date:histStockDate,
        costPerUnit:Number(line.costPerUnit)||prod.costPrice||0,
        notes:line.notes||"Historical stock entry",
        recordedBy:currentUser.id,
        createdAt:new Date().toISOString(),
        isHistorical:true,
      };
      await dbPut("stockAdjustments",adj);
      // Update the product's current stock by adding this historical qty
      await upStock(pid,prod.stock+qty);
      // Also update cost price if provided
      if(line.costPerUnit&&Number(line.costPerUnit)>0){
        const updProd={...products.find(p=>p.id===pid),stock:prod.stock+qty,costPrice:Number(line.costPerUnit)};
        await dbPut("products",updProd);
        setProducts(prev=>prev.map(p=>p.id===pid?updProd:p));
      }
      updated++;
    }

                <li>If stock runs out, first add opening stock on the <b>Opening Stock</b> tab for an earlier date</li>
                <li>All recorded sales will appear correctly in Reports by date</li>
                <li>You can come back and add more sales for any other past date</li>
              </ul>
            </div>
          </div>}

          {/* ── Opening Stock Entry ── */}
          {histSubTab==="stock"&&<div className="space-y-4">
            <Card>
              <CH>
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <CT>Record Opening / Historical Stock</CT>
                    <p className="text-xs text-slate-400 mt-0.5">Add stock quantities that existed before this app. This increases the current stock of each product.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <Lbl>Date of stock:</Lbl>
                    <Inp type="date" cls="w-40" value={histStockDate} max={today()} onChange={e=>setHistStockDate(e.target.value)}/>
                  </div>
                </div>
              </CH>
              <CC>
                <div className="grid grid-cols-12 gap-2 mb-2 text-xs font-semibold text-slate-500 px-1">
                  <div className="col-span-4">Product</div>
                  <div className="col-span-2">Qty to Add</div>
                  <div className="col-span-2">Cost/Unit (TZS)</div>
                  <div className="col-span-3">Notes</div>
                  <div className="col-span-1"></div>
                </div>
                <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                  {histStockLines.map((line,i)=>{
                    const prod=products.find(p=>p.id===Number(line.productId));
                    return (
                      <div key={i} className={cn("grid grid-cols-12 gap-2 items-start rounded-2xl p-2 border",i%2===0?"bg-slate-50":"bg-white")}>
                        <div className="col-span-4">
                          <Sel value={String(line.productId)} onChange={v=>updHistStockLine(i,"productId",v)} ph="— select —">
                            {products.map(p=><option key={p.id} value={String(p.id)}>{p.name} (now: {p.stock})</option>)}
                          </Sel>
                          {prod&&<p className="text-xs text-slate-400 mt-0.5 pl-1">Current stock: {prod.stock} · Cost price: {cur(prod.costPrice)}</p>}
                        </div>
                        <div className="col-span-2">
                          <Inp type="number" min="0" value={line.qty} placeholder="e.g. 50" onChange={e=>updHistStockLine(i,"qty",e.target.value)}/>
                          {prod&&line.qty&&<p className="text-xs text-emerald-600 mt-0.5 pl-1">→ New total: {prod.stock+Number(line.qty)}</p>}
                        </div>
                        <div className="col-span-2">
                          <Inp type="number" min="0" value={line.costPerUnit} placeholder={prod?String(prod.costPrice):"0"} onChange={e=>updHistStockLine(i,"costPerUnit",e.target.value)}/>
                        </div>
                        <div className="col-span-3">
                          <Inp value={line.notes} placeholder="e.g. Opening stock Jan 2025" onChange={e=>updHistStockLine(i,"notes",e.target.value)}/>
                        </div>
                        <div className="col-span-1 flex justify-center pt-1">
                          {histStockLines.length>1&&<button onClick={()=>removeHistStockLine(i)} className="text-red-400 hover:text-red-600 text-lg font-bold leading-none">×</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Summary */}
                {histStockLines.some(l=>l.productId&&l.qty)&&(()=>{
                  const totalUnits=histStockLines.reduce((s,l)=>s+Number(l.qty||0),0);
                  const totalVal=histStockLines.reduce((s,l)=>{const cost=Number(l.costPerUnit)||products.find(p=>p.id===Number(l.productId))?.costPrice||0;return s+cost*Number(l.qty||0);},0);
                  return <div className="mt-3 rounded-xl bg-emerald-50 border border-emerald-100 px-4 py-2 flex gap-6 text-xs">
                    <span className="text-slate-500">Date: <b className="text-slate-800">{histStockDate}</b></span>
                    <span className="text-slate-500">Products: <b className="text-slate-800">{histStockLines.filter(l=>l.productId&&l.qty).length}</b></span>
                    <span className="text-slate-500">Total Units: <b className="text-emerald-700">{totalUnits}</b></span>
                    <span className="text-slate-500">Est. Value: <b className="text-emerald-700">{cur(totalVal)}</b></span>
                  </div>;
                })()}

                <div className="flex gap-2 mt-3 flex-wrap">
                  <Btn v="outline" onClick={addHistStockLine}>➕ Add Row</Btn>
                  <Btn onClick={saveHistoricalStock} cls="bg-emerald-700 text-white hover:bg-emerald-800">📦 Save Stock as of {histStockDate}</Btn>
                  <Btn v="ghost" onClick={()=>setHistStockLines([{productId:"",qty:"",costPerUnit:"",notes:""}])}>🗑 Clear All</Btn>
                </div>
              </CC>
            </Card>

            <div className="rounded-2xl bg-blue-50 border border-blue-100 p-4">
              <p className="text-xs font-semibold text-blue-700 mb-1">💡 How to use Opening Stock Entry</p>
              <ul className="text-xs text-blue-700 space-y-1 list-disc list-inside">
                <li>Use this to add the stock you had before starting this app</li>
                <li>Example: "I had 100 USB cables on 1st January 2025 — enter qty 100 for that date"</li>
                <li>The qty will be <b>added</b> to the current stock count</li>
                <li>If cost price is left blank, the product's existing cost price is used</li>
                <li>Entering stock before recording past sales ensures the sales don't fail due to insufficient stock</li>
              </ul>
            </div>
          </div>}

          {/* ── Review History ── */}
          {histSubTab==="review"&&<div className="space-y-4">
            <Card>
              <CH>
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <CT>Review Historical Entries</CT>
                  <div className="flex items-center gap-2">
                    <Lbl>Filter by date:</Lbl>
                    <Inp type="date" cls="w-40" value={histViewDate} onChange={e=>setHistViewDate(e.target.value)} placeholder="All dates"/>
                    {histViewDate&&<Btn v="ghost" onClick={()=>setHistViewDate("")}>✕ Clear</Btn>}
                  </div>
                </div>
              </CH>
              <CC>
                {(()=>{
                  const histSales=salesD.filter(s=>s.isHistorical&&(!histViewDate||s.createdAt.slice(0,10)===histViewDate));
                  const histStockAdjs=(async()=>{})();
                  const grouped={};
                  histSales.forEach(s=>{const d=s.createdAt.slice(0,10);if(!grouped[d])grouped[d]=[];grouped[d].push(s);});
                  const dates=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
                  if(!dates.length) return (
                    <div className="text-center py-10">
                      <p className="text-3xl mb-2">📋</p>
                      <p className="text-sm font-medium text-slate-600">No historical sales recorded yet</p>
                      <p className="text-xs text-slate-400 mt-1">Use the "Past Sales" and "Opening Stock" tabs to add past data</p>
                    </div>
                  );
                  return (
                    <div className="space-y-4">
                      {/* Summary cards */}
                      <div className="grid grid-cols-3 gap-3">
                        <MCard title="Historical Sales" value={histSales.length+" transactions"} icon="📋" cls="bg-indigo-50 text-indigo-500"/>
                        <MCard title="Historical Revenue" value={cur(histSales.reduce((s,x)=>s+x.total,0))} icon="💰" cls="bg-purple-50 text-purple-500"/>
                        <MCard title="Date Range" value={dates.length+" day(s)"} icon="📅" cls="bg-slate-50 text-slate-500"/>
                      </div>
                      {/* Grouped by day */}
                      {dates.map(date=>{
                        const daySalesHist=grouped[date];
                        const dayTotal=daySalesHist.reduce((s,x)=>s+x.total,0);
                        const dayProfit=daySalesHist.reduce((s,x)=>s+(x.unitPrice-(x.costPrice||0))*x.qty,0);
                        return (
                          <Card key={date}>
                            <CH>
                              <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                  <div className="h-10 w-10 rounded-xl bg-indigo-600 text-white flex flex-col items-center justify-center leading-tight">
                                    <span className="text-xs font-bold">{new Date(date+"T12:00:00").toLocaleDateString("en",{day:"2-digit"})}</span>
                                    <span className="text-xs">{new Date(date+"T12:00:00").toLocaleDateString("en",{month:"short"})}</span>
                                  </div>
                                  <div>
                                    <CT>{new Date(date+"T12:00:00").toLocaleDateString("en",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</CT>
                                    <p className="text-xs text-slate-400">{daySalesHist.length} item(s) sold</p>
                                  </div>
                                </div>
                                <div className="text-right">
                                  <p className="text-sm font-bold text-slate-800">{cur(dayTotal)}</p>
                                  <p className="text-xs text-emerald-600">Profit: {cur(dayProfit)}</p>
                                </div>
                              </div>
                            </CH>
                            <CC>
                              <Tbl>
                                <thead><tr>
                                  <Th>Product</Th><Th>Qty</Th><Th>Type</Th><Th>Payment</Th><Th>Customer</Th><Th>Total</Th><Th>Profit</Th>
                                </tr></thead>
                                <tbody>
                                  {daySalesHist.map((s,idx)=>(
                                    <tr key={idx}>
                                      <Td cls="font-medium">{s.productName}</Td>
                                      <Td>{s.qty}</Td>
                                      <Td cls="capitalize">{s.sellingType}</Td>
                                      <Td><Bdg cls={s.paymentMode==="credit"?"bg-red-100 text-red-700":s.paymentMode==="transfer"?"bg-blue-100 text-blue-700":"bg-emerald-100 text-emerald-700"}>{s.paymentMode}</Bdg></Td>
                                      <Td cls="text-slate-400">{s.customerName||"—"}</Td>
                                      <Td cls="font-semibold">{cur(s.total)}</Td>
                                      <Td cls="text-emerald-600">{cur((s.unitPrice-(s.costPrice||0))*s.qty)}</Td>
                                    </tr>
                                  ))}
                                </tbody>
                              </Tbl>
                              <div className="flex justify-end gap-4 text-xs mt-2 text-slate-400">
                                <span>Cash: <b className="text-slate-700">{cur(daySalesHist.filter(s=>s.paymentMode==="cash").reduce((a,x)=>a+x.total,0))}</b></span>
                                <span>Transfer: <b className="text-slate-700">{cur(daySalesHist.filter(s=>s.paymentMode==="transfer").reduce((a,x)=>a+x.total,0))}</b></span>
                                <span>Credit: <b className="text-red-600">{cur(daySalesHist.filter(s=>s.paymentMode==="credit").reduce((a,x)=>a+x.total,0))}</b></span>
                              </div>
                            </CC>
                          </Card>
                        );
                      })}
                    </div>
                  );
                })()}
              </CC>
            </Card>
          </div>}
        </div>}

        {/* ── DATA & BACKUP ── */}
        {tab==="data"&&isAdmin&&<div className="space-y-4">
          <Card><CH><CT>Storage Status</CT></CH><CC>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
              {[["Products",products.length,"📦"],["Sales",sales.length,"🛒"],["Credits",credits.length,"🤝"],["Customers",customers.length,"👥"],["Expenses",expenses.length,"💸"]].map(([l,v,i])=>(
                <MCard key={l} title={l} value={v} icon={i}/>
              ))}
            </div>
            {storageEst&&storageEst.quota>0&&<div className="rounded-xl bg-slate-50 p-4">
              <div className="flex justify-between text-xs mb-2"><span className="font-medium">IndexedDB Used</span><span>{fmtB(storageEst.used)} / {fmtB(storageEst.quota)} ({storageEst.pct}%)</span></div>
              <div className="h-3 w-full rounded-full bg-slate-200"><div className={cn("h-3 rounded-full",storageEst.pct>80?"bg-red-500":storageEst.pct>50?"bg-amber-500":"bg-emerald-500")} style={{width:`${Math.min(storageEst.pct,100)}%`}}/></div>
              {storageEst.pct>75&&<p className="mt-2 text-amber-600 text-xs">⚠ Storage over 75% — export backup now!</p>}
            </div>}
          </CC></Card>

          {/* XLSX Export Section */}
          <Card><CH><div className="flex items-center gap-2"><span className="text-base">📊</span><CT>Export to XLSX (Excel) — Admin Only</CT></div></CH><CC>
            <p className="text-xs text-slate-400 mb-4">Export your business data as professional Excel files. Open in Microsoft Excel, Google Sheets, or LibreOffice.</p>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 space-y-2">
                <p className="font-semibold text-sm text-emerald-800">🗂 Full Business Report</p>
                <p className="text-xs text-slate-500">All sheets: Sales, Products, Expenses, Customers, Winga Credits, Summary — in one XLSX file. Best for moving to Windows PC.</p>
                <Btn v="success" cls="w-full" onClick={xlsxFull}>⬇ Export Full XLSX</Btn>
              </div>
              <div className="rounded-2xl border p-4 space-y-2">
                <p className="font-semibold text-sm">🛒 Sales History XLSX</p>
                <p className="text-xs text-slate-500">Export sales by period.</p>
                <div className="grid grid-cols-2 gap-2">
                  <Btn v="success" cls="text-xs" onClick={()=>xlsxExportSales(daySales,"today")}>Today</Btn>
                  <Btn v="success" cls="text-xs" onClick={()=>xlsxExportSales(wkSales,"week")}>Week</Btn>
                  <Btn v="success" cls="text-xs" onClick={()=>xlsxExportSales(monSales,"month")}>Month</Btn>
                  <Btn v="success" cls="text-xs" onClick={()=>xlsxExportSales(salesD,"all")}>All Time</Btn>
                </div>
              </div>
              <div className="rounded-2xl border p-4 space-y-2">
                <p className="font-semibold text-sm">📦 Inventory XLSX</p>
                <p className="text-xs text-slate-500">Products with prices, stock, and margin %.</p>
                <Btn v="success" cls="w-full" onClick={()=>xlsxExportInventory(products)}>⬇ Export Inventory</Btn>
              </div>
              <div className="rounded-2xl border p-4 space-y-2">
                <p className="font-semibold text-sm">💸 Expenses XLSX</p>
                <p className="text-xs text-slate-500">All expense records.</p>
                <Btn v="success" cls="w-full" onClick={()=>xlsxExportExpenses(expenses,users)}>⬇ Export Expenses</Btn>
              </div>
              <div className="rounded-2xl border p-4 space-y-2">
                <p className="font-semibold text-sm">👥 Customers XLSX</p>
                <p className="text-xs text-slate-500">Customer records with purchase totals.</p>
                <Btn v="success" cls="w-full" onClick={()=>xlsxExportCustomers(customers,salesD)}>⬇ Export Customers</Btn>
              </div>
            </div>
          </CC></Card>

          {/* CSV Export */}
          <Card><CH><div className="flex items-center gap-2"><span className="text-base">📄</span><CT>Export to CSV — Admin Only</CT></div></CH><CC>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <Btn v="outline" onClick={()=>expCSV("all")}>⬇ Sales CSV</Btn>
              <Btn v="outline" onClick={invCSV}>⬇ Inventory CSV</Btn>
              <Btn v="outline" onClick={expExpCSV}>⬇ Expenses CSV</Btn>
              <Btn v="outline" onClick={custCSV}>⬇ Customers CSV</Btn>
            </div>
          </CC></Card>

          {/* JSON Backup */}
          <Card><CH><div className="flex items-center gap-2"><span className="text-base">💾</span><CT>JSON Backup (Full Restore) — Admin Only</CT></div></CH><CC>
            <p className="text-xs text-slate-400 mb-4">JSON backup saves and restores <b>everything</b> including all history. Use this to move to a new computer or browser.</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="rounded-2xl border p-4 space-y-2">
                <p className="font-semibold text-sm">Export JSON Backup</p>
                <p className="text-xs text-slate-400">Save a complete system backup file.</p>
                <Btn v="blue" cls="w-full" onClick={exportJSON}>⬇ Export JSON Backup</Btn>
              </div>
              <div className="rounded-2xl border border-dashed p-4 space-y-2 text-center">
                <p className="font-semibold text-sm">Restore JSON Backup</p>
                <p className="text-xs text-red-500">⚠ Replaces ALL current data.</p>
                <input ref={jsonImportRef} type="file" accept=".json" className="hidden" onChange={handleJSON}/>
                <Btn cls="w-full" onClick={()=>jsonImportRef.current?.click()}>📂 Choose JSON File</Btn>
              </div>
            </div>
          </CC></Card>

          {/* XLSX Import */}
          <Card><CH><div className="flex items-center gap-2"><span className="text-base">📥</span><CT>Import from XLSX — Admin Only</CT></div></CH><CC>
            <p className="text-xs text-slate-400 mb-4">Import data from Excel files exported by this app. Useful when moving from Chrome OS to a Windows PC.</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="rounded-2xl border border-dashed p-4 space-y-2 text-center">
                <p className="font-semibold text-sm">Import Full XLSX</p>
                <p className="text-xs text-slate-400">Import Products, Customers and Expenses from a Full XLSX export.</p>
                <p className="text-xs text-red-500">⚠ Replaces products, customers & expenses data.</p>
                <input ref={xlsxImportRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleXLSXImport}/>
                <Btn v="warn" cls="w-full" onClick={()=>xlsxImportRef.current?.click()}>📂 Import Full XLSX</Btn>
              </div>
              <div className="rounded-2xl border border-dashed p-4 space-y-2 text-center">
                <p className="font-semibold text-sm">Import Products Only</p>
                <p className="text-xs text-slate-400">Import or update product list from an Inventory XLSX file.</p>
                <p className="text-xs text-red-500">⚠ Replaces all products.</p>
                <input ref={xlsxProdRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleXLSXProds}/>
                <Btn v="warn" cls="w-full" onClick={()=>xlsxProdRef.current?.click()}>📂 Import Products XLSX</Btn>
              </div>
            </div>
            <div className="mt-4 rounded-xl bg-blue-50 border border-blue-100 p-3">
              <p className="text-xs font-semibold text-blue-700 mb-1">💡 Recommended transfer workflow: Chrome OS → Windows PC</p>
              <ol className="text-xs text-blue-600 space-y-1 list-decimal list-inside">
                <li>On Chrome OS: Export Full XLSX (above) + Export JSON Backup</li>
                <li>Copy both files to USB stick or Google Drive</li>
                <li>On Windows PC: Open this HTML file in Chrome</li>
                <li>Go to Data & Backup → Restore JSON Backup (this restores everything)</li>
                <li>The XLSX file is for reference / analysis in Excel</li>
              </ol>
            </div>
          </CC></Card>
        </div>}

        {/* ── USERS ── */}
        {tab==="users"&&isAdmin&&<div className="space-y-4">
          <Card><CH><CT>Create User</CT></CH><CC>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              <div><Lbl>Name</Lbl><Inp value={uForm.name} onChange={e=>setUForm({...uForm,name:e.target.value})}/></div>
              <div><Lbl>Username</Lbl><Inp value={uForm.username} onChange={e=>setUForm({...uForm,username:e.target.value})}/></div>
              <div><Lbl>Password</Lbl><Inp value={uForm.password} onChange={e=>setUForm({...uForm,password:e.target.value})}/></div>
              <div><Lbl>Role</Lbl><Sel value={uForm.role} onChange={v=>setUForm({...uForm,role:v})}><option value="admin">Admin</option><option value="employee">Employee</option></Sel></div>
              <div><Lbl>Signature</Lbl><Inp value={uForm.signature} onChange={e=>setUForm({...uForm,signature:e.target.value})}/></div>
            </div>
            <Btn cls="mt-3" onClick={addUser}>🛡 Create User</Btn>
          </CC></Card>
          <Card><CH><CT>System Users</CT></CH><CC>
            <Tbl><thead><tr><Th>Name</Th><Th>Username</Th><Th>Role</Th><Th>Signature</Th></tr></thead>
              <tbody>{users.map(u=>(
                <tr key={u.id}><Td cls="font-medium">{u.name}</Td><Td>{u.username}</Td>
                  <Td><Bdg cls={u.role==="admin"?"bg-amber-100 text-amber-700":"bg-blue-100 text-blue-700"}>{u.role}</Bdg></Td>
                  <Td cls="italic text-slate-400">{u.signature}</Td></tr>
              ))}</tbody>
            </Tbl>
          </CC></Card>
        </div>}

        {/* ── SETTINGS ── */}
        {tab==="settings"&&isAdmin&&<div className="space-y-4">
          <Card><CH><CT>Business Settings</CT></CH><CC>
            {!settingsEdit?(
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  {[["Business Name",settings.businessName],["Location",settings.businessLocation],["Report Footer Note",settings.footerNote||"—"]].map(([l,v])=>(
                    <div key={l} className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-400">{l}</p><p className="font-semibold text-sm mt-1">{v}</p></div>
                  ))}
                </div>
                <Btn v="outline" onClick={()=>setSettingsEdit({...settings})}>⚙️ Edit Settings</Btn>
              </div>
            ):(
              <div className="space-y-3">
                <div><Lbl>Business Name</Lbl><Inp value={settingsEdit.businessName} onChange={e=>setSettingsEdit({...settingsEdit,businessName:e.target.value})}/></div>
                <div><Lbl>Location</Lbl><Inp value={settingsEdit.businessLocation} onChange={e=>setSettingsEdit({...settingsEdit,businessLocation:e.target.value})}/></div>
                <div><Lbl>Report Footer Note</Lbl><Inp value={settingsEdit.footerNote} onChange={e=>setSettingsEdit({...settingsEdit,footerNote:e.target.value})}/></div>
                <div className="flex gap-2"><Btn v="success" onClick={saveSettings}>✅ Save</Btn><Btn v="outline" onClick={()=>setSettingsEdit(null)}>Cancel</Btn></div>
              </div>
            )}
          </CC></Card>
        </div>}
      </main>

      {/* Delete confirm */}
      <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="Confirm Delete">
        <p className="text-sm text-slate-600 mb-5">Delete this {confirmDel?.type}? This cannot be undone.</p>
        <div className="flex gap-3 justify-end">
          <Btn v="outline" onClick={()=>setConfirmDel(null)}>Cancel</Btn>
          <Btn v="destructive" onClick={()=>{if(confirmDel?.type==="product")delProduct(confirmDel.id);if(confirmDel?.type==="expense")delExpense(confirmDel.id);setConfirmDel(null);}}>Delete</Btn>
        </div>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
